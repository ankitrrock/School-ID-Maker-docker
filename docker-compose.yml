services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_id_maker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d school_id_maker"]
      interval: 5s
      timeout: 5s
      retries: 20

  upload-permissions:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /uploads /secrets"]
    volumes:
      - uploads:/uploads
      - jwt_secrets:/secrets

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/school_id_maker
      JWT_SECRET: ${JWT_SECRET:-}
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-id-card-assets}
      FREE_STUDENT_LIMIT: ${FREE_STUDENT_LIMIT:-50}
      FREE_CARD_LIMIT: ${FREE_CARD_LIMIT:-50}
      PRO_STUDENT_LIMIT: ${PRO_STUDENT_LIMIT:-5000}
      PRO_CARD_LIMIT: ${PRO_CARD_LIMIT:-5000}
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - uploads:/app/data/uploads
      - jwt_secrets:/app/data/secrets
    depends_on:
      db:
        condition: service_healthy
      upload-permissions:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads:
  jwt_secrets:
