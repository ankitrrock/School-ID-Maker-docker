server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API proxy: the frontend calls "/api/..." by default
  # (see src/components/auth/AuthPage.tsx), so no CORS setup is needed.
  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path / /;
  }

  # Client-side routed SPA: fall back to index.html for unknown paths.
  location / {
    try_files $uri /index.html;
  }
}
